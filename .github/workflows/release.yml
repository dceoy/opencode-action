---
name: Publish GitHub Release
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST
  release:
    types:
      - released
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Only predefined release tasks are selectable
    inputs:
      task:
        description: Release task
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
          - post-release
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'dceoy/opencode-action'
      && github.event_name != 'release'
      && inputs.task != 'post-release'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        action.yml
        scripts
        .opencode
        .github/workflows/opencode-bot.yml
        .github/workflows/opencode-review.yml
  tag:
    needs: release
    if: >-
      always() &&
      (github.event_name == 'release' || inputs.task == 'post-release' ||
       (needs.release.result == 'success' && needs.release.outputs.release-tag != ''))
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-major-version-tag.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      tag-name: ${{ needs.release.outputs.release-tag || github.event.release.tag_name }}
  release-pins:
    needs: release
    if: >-
      always() &&
      (github.event_name == 'release' || inputs.task == 'post-release' ||
       (needs.release.result == 'success' && needs.release.outputs.release-tag != ''))
    permissions:
      contents: write
      pull-requests: write
    uses: dceoy/gha-for-devops/.github/workflows/github-action-release-pins.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      release-tag: ${{ needs.release.outputs.release-tag || github.event.release.tag_name }}
      pr-loop-ref-input: pr-review-ref
      update-reusable-workflow-docs: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
