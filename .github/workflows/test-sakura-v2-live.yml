---
name: Trusted Sakura v2 integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sakura:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: sakura-integration
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install pinned OpenCode
        run: |
          corepack install --global pnpm@latest
          corepack pnpm install --frozen-lockfile
          (cd node_modules/@opencode/cli && node postinstall.mjs)
      - name: Run Sakura tool call
        env:
          SAKURA_AI_ENGINE_API_KEY: ${{ secrets.SAKURA_AI_ENGINE_API_KEY }}
          SAKURA_MODEL: ${{ vars.SAKURA_MODEL }}
          OPENCODE_V2_BIN: >-
            ${{ github.workspace }}/node_modules/@opencode/cli/bin/opencode.exe
        run: bash scripts/test-sakura-v2-live.sh
