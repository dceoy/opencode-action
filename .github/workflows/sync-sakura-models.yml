---
name: Sync Sakura AI Engine models
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  sync-sakura-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync Sakura AI Engine models
        env:
          SAKURA_AI_ENGINE_API_KEY: ${{ secrets.SAKURA_AI_ENGINE_API_KEY }}
        run: >
          bash scripts/sync-sakura-models.sh
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: Sync Sakura AI Engine models
          title: Sync Sakura AI Engine models
          branch: github-actions/sakura-models
          base: ${{ github.event.repository.default_branch }}
          labels: agent:github-actions
          body: Sync the Sakura AI Engine models exposed to OpenCode with the models currently available from the API.
          delete-branch: true
