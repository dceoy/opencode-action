---
name: Pull request review using OpenCode
on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
        description: Model to use with OpenCode
      agent:
        required: false
        type: string
        description: Primary agent to use
        default: build
      share:
        required: false
        type: boolean
        description: Share the OpenCode session
        default: false
      prompt:
        required: false
        type: string
        description: Review prompt
        default: /pr-review
      use-github-token:
        required: false
        type: boolean
        description: Use GITHUB_TOKEN directly instead of OpenCode App token exchange
        default: false
      mentions:
        required: false
        type: string
        description: Comma-separated list of trigger phrases
        default: /opencode,/oc
      variant:
        required: false
        type: string
        description: Provider-specific model variant
        default: ''
      oidc-base-url:
        required: false
        type: string
        description: Base URL for OIDC token exchange
        default: https://api.opencode.ai
      opencode-version:
        required: false
        type: string
        description: OpenCode version to install
        default: latest
      use-bundled-toolkit:
        required: false
        type: boolean
        description: Use the action's bundled OpenCode toolkit
        default: true
      pr-review-ref:
        required: false
        type: string
        description: Full immutable pr-loop commit SHA
        default: ''
      timeout-minutes:
        required: false
        type: number
        description: Maximum minutes to let OpenCode run
        default: 60
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      ANTHROPIC_API_KEY:
        required: false
        description: Anthropic API key
      OPENAI_API_KEY:
        required: false
        description: OpenAI API key
      OPENROUTER_API_KEY:
        required: false
        description: OpenRouter API key
      OPENCODE_API_KEY:
        required: false
        description: OpenCode API key
      SAKURA_AI_ENGINE_API_KEY:
        required: false
        description: Sakura AI Engine API key
      GOOGLE_GENERATIVE_AI_API_KEY:
        required: false
        description: Google Generative AI API key
      DEEPSEEK_API_KEY:
        required: false
        description: DeepSeek API key
      XAI_API_KEY:
        required: false
        description: xAI API key
      GROQ_API_KEY:
        required: false
        description: Groq API key
      CEREBRAS_API_KEY:
        required: false
        description: Cerebras API key
      MOONSHOT_API_KEY:
        required: false
        description: Moonshot AI API key
      GH_TOKEN:
        required: false
        description: GitHub token for repository access
  pull_request:
    types:
      - opened
      - ready_for_review
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  opencode-review:
    if: >
      github.event_name == 'pull_request'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      && (! github.event.pull_request.draft)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          persist-credentials: ${{ inputs.use-github-token }}
      - name: Configure Git identity
        if: inputs.use-github-token
        run: |
          git config --local user.name 'opencode-agent[bot]'
          git config --local user.email 'opencode-agent[bot]@users.noreply.github.com'
      - name: Resolve default pr-loop pin
        if: inputs.pr-review-ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ref="${WORKFLOW_SHA}"
          if [[ "${GITHUB_REPOSITORY}" == 'dceoy/opencode-action' && "${EVENT_NAME}" == 'pull_request' ]]; then
            ref="${PR_BASE_SHA}"
          fi
          if [[ ! "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid reusable workflow/base commit SHA.' >&2
            exit 1
          fi
          if ! pin="$(gh api "repos/dceoy/opencode-action/contents/.github/pr-loop-ref?ref=${ref}" \
                       -H 'Accept: application/vnd.github.raw+json' 2>/dev/null)"; then
            # During migration, the trusted base revision may still use the legacy inline pin.
            if [[ "${GITHUB_REPOSITORY}" != 'dceoy/opencode-action' || "${EVENT_NAME}" != 'pull_request' ]]; then
              echo 'Could not resolve default pr-loop pin.' >&2
              exit 1
            fi
            legacy="$(gh api "repos/dceoy/opencode-action/contents/.github/workflows/opencode-review.yml?ref=${ref}" \
                         -H 'Accept: application/vnd.github.raw+json')"
            pin="$(sed -n -E 's/^  PR_LOOP_REF: ([0-9a-f]{40})  # (v[0-9]+\.[0-9]+\.[0-9]+)$/\1  # \2/p' <<< "${legacy}")"
          fi
          read -r sha marker version extra <<< "${pin}"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ || "${marker}" != '#' ||
                ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || -n "${extra:-}" ]]; then
            echo 'Invalid default pr-loop release pin.' >&2
            exit 1
          fi
          printf 'PR_LOOP_REF=%s\n' "${sha}" >> "${GITHUB_ENV}"
      - name: Run OpenCode
        uses: $/.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SAKURA_AI_ENGINE_API_KEY: ${{ secrets.SAKURA_AI_ENGINE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PR_REVIEW_URL: ${{ github.event.pull_request.html_url }}
          PR_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          model: ${{ inputs.model || 'sakura/preview/Kimi-K2.7-Code' }}
          agent: ${{ inputs.agent || 'build' }}
          share: ${{ inputs.share }}
          prompt: ${{ inputs.prompt || '/pr-review' }}
          use-github-token: ${{ inputs.use-github-token }}
          mentions: ${{ inputs.mentions || '/opencode,/oc' }}
          variant: ${{ inputs.variant }}
          oidc-base-url: ${{ inputs.oidc-base-url || 'https://api.opencode.ai' }}
          opencode-version: ${{ inputs.opencode-version || 'latest' }}
          use-bundled-toolkit: ${{ inputs.model == '' || inputs.use-bundled-toolkit }}
          review-only: true
          pr-review-ref: ${{ inputs.pr-review-ref || env.PR_LOOP_REF }}
          timeout-minutes: ${{ inputs.timeout-minutes || 60 }}
