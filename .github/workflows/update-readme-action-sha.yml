---
name: Update README action SHA
on:
  release:
    types:
      - released
permissions: {}
jobs:
  update-readme-action-sha:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Update README action SHA
        id: update
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          match_count="$(grep -Ec 'uses: dceoy/opencode-action@[0-9a-f]{40}' README.md || true)"
          if [[ "${match_count}" != 1 ]]; then
            echo "Expected exactly one pinned dceoy/opencode-action reference in README.md, found ${match_count}." >&2
            exit 1
          fi
          sed -E -i "s|(uses: dceoy/opencode-action@)[0-9a-f]{40}( +#.*)?|\1${release_sha} # ${RELEASE_TAG}|" README.md
          if git diff --quiet -- README.md; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
            echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ steps.update.outputs.release_sha }}
        run: |
          branch="automation/update-readme-action-sha-${RELEASE_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add README.md
          git commit -m "Update README action SHA for ${RELEASE_TAG}"
          gh auth setup-git
          git push --set-upstream origin "${branch}"
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "Update README action SHA for ${RELEASE_TAG}" \
            --body "Pin the README action example to ${RELEASE_TAG} (${RELEASE_SHA})."
