---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      search-path: .github/workflows
      yamllint-search-path: .
      zizmor-search-path: .
  markdown-lint:
    permissions:
      contents: read
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      search-path: .
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/shell-lint.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      search-path: .
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/bats-test.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      search-path: .
      setup-run: |
        set -euo pipefail
        corepack install --global pnpm@latest
        # Run only the two explicit postinstalls below.
        corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
        (cd node_modules/opencode-ai && node postinstall.mjs)
        (cd node_modules/@opencode/cli && node postinstall.mjs)
        # Both generations ship an `opencode` bin, so expose each explicitly.
        echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
        mkdir -p "${RUNNER_TEMP}/opencode-v1-bin"
        ln -s "${GITHUB_WORKSPACE}/node_modules/opencode-ai/bin/opencode.exe" "${RUNNER_TEMP}/opencode-v1-bin/opencode"
        echo "${RUNNER_TEMP}/opencode-v1-bin" >> "${GITHUB_PATH}"
        echo "OPENCODE_V2_BIN=${GITHUB_WORKSPACE}/node_modules/@opencode/cli/bin/opencode.exe" >> "${GITHUB_ENV}"
        echo "GH_SKILL_SMOKE=true" >> "${GITHUB_ENV}"
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - github-actions-lint-and-scan
      - markdown-lint
      - shell-lint
      - bats-test
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      unconditional: true
