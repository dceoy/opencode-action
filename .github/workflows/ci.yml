---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@main   # zizmor: ignore[unpinned-uses]
    with:
      search-path: .github/workflows
      yamllint-search-path: .
      zizmor-search-path: .
  markdown-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/shell-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/bats-test.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
      setup-run: |
        corepack install --global pnpm@latest
        corepack pnpm install --frozen-lockfile
        (cd node_modules/opencode-ai && node postinstall.mjs)
        echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
  github-codeql-analysis:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      language: >
        ["actions"]
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - github-actions-lint-and-scan
      - markdown-lint
      - shell-lint
      - bats-test
      - github-codeql-analysis
      - pnpm-skill-install
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true

  pnpm-skill-install:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned pr-review skill installation
        shell: bash -euo pipefail {0}
        run: |
          ref="$(sed -n -E 's/^  PR_LOOP_REF: ([a-f0-9]{40}).*/\1/p' .github/workflows/opencode-review.yml)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          install_home="${RUNNER_TEMP}/pr-review-install-home"
          mkdir -p "${install_home}"
          HOME="${install_home}" USE_BUNDLED_TOOLKIT=true PR_REVIEW_REF="${ref}" OPENCODE_VERSION=1.2.14 \
            bash scripts/install-pr-review.sh
          test -f "${install_home}/.config/opencode/skills/pr-review/SKILL.md"
          test -f "${install_home}/.config/opencode/skills/pr-review/references/github-posting.md"
          grep -q 'opencode/slash: "true"' "${install_home}/.config/opencode/skills/pr-review/SKILL.md"
