---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@main   # zizmor: ignore[unpinned-uses]
    with:
      search-path: .github/workflows
      yamllint-search-path: .
      zizmor-search-path: .
  markdown-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/shell-lint.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
  bats-test:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/bats-test.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      search-path: .
      setup-run: |
        corepack install --global pnpm@latest
        export PNPM_HOME="${RUNNER_TEMP}/pnpm"
        mkdir -p "${PNPM_HOME}"
        export PATH="${PNPM_HOME}:${PNPM_HOME}/bin:${PATH}"
        corepack pnpm runtime set node latest -g
        echo "${PNPM_HOME}" >> "${GITHUB_PATH}"
        echo "${PNPM_HOME}/bin" >> "${GITHUB_PATH}"
        corepack pnpm install --frozen-lockfile
        (cd node_modules/opencode-ai && node postinstall.mjs)
        echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
        echo "GH_SKILL_SMOKE=true" >> "${GITHUB_ENV}"
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - github-actions-lint-and-scan
      - markdown-lint
      - shell-lint
      - bats-test
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
