---
name: Post-release
on:
  release:
    types:
      - released
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  tag:
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-major-version-tag.yml@main  # zizmor: ignore[unpinned-uses]
  release-pins:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          if [[ -n "${EVENT_TAG}" ]]; then
            tag="${EVENT_TAG}"
          else
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
            if [[ -z "${tag}" ]]; then
              echo 'No latest release found' >&2
              exit 1
            fi
          fi
          tee -a "${GITHUB_OUTPUT}" <<< "tag=${tag}"
      - name: Update release pins
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          readme_match_count="$(grep -Ec 'uses: dceoy/opencode-action@[0-9a-f]{40}' README.md || true)"
          if [[ "${readme_match_count}" != 1 ]]; then
            echo "Expected exactly one pinned dceoy/opencode-action reference in README.md, found ${readme_match_count}." >&2
            exit 1
          fi

          workflow_match_count="$(grep -Ec 'uses: dceoy/opencode-action/.github/workflows/opencode-(bot|review)\.yml@[0-9a-f]{40}' docs/reusable-workflows.md || true)"
          if [[ "${workflow_match_count}" != 2 ]]; then
            echo "Expected exactly two pinned reusable workflow references in docs/reusable-workflows.md, found ${workflow_match_count}." >&2
            exit 1
          fi

          sed -iE "s|(uses: dceoy/opencode-action@)[0-9a-f]{40}( +#.*)?|\1${release_sha} # ${RELEASE_TAG}|" README.md
          sed -iE "s|(uses: dceoy/opencode-action/.github/workflows/opencode-(bot|review)\.yml@)[0-9a-f]{40}|\1${release_sha}|g" docs/reusable-workflows.md
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          commit-message: Update release pins for ${{ steps.release.outputs.tag }}
          title: Update release pins for ${{ steps.release.outputs.tag }}
          branch: github-actions/release-pins
          base: ${{ github.event.repository.default_branch }}
          body: Update the README action pin and reusable workflow documentation pins for ${{ steps.release.outputs.tag }}.
          delete-branch: true
