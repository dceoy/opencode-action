---
name: OpenCode GitHub Action
description: Run OpenCode in GitHub Actions workflows
branding:
  icon: square
  color: black
inputs:
  model:
    required: true
    description: Model to use, in provider/model format
  agent:
    required: false
    description: Agent to use as the run's default_agent. A slash command's frontmatter agent takes precedence.
    default: build
  share:
    required: false
    description: Whether to share the opencode session
    default: 'false'
  prompt:
    required: false
    description: Custom prompt to override the default prompt. Leading Markdown slash commands are expanded before opencode github run.
    default: ''
  use-github-token:
    required: false
    description: Whether to use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var.
    default: 'false'
  mentions:
    required: false
    description: Comma-separated list of trigger phrases (case-insensitive)
    default: /opencode,/oc
  variant:
    required: false
    description: >-
      Model variant for provider-specific reasoning effort (e.g., high, max, minimal).
      Empty runs every model with its default configuration. The action rejects a nonempty value only when its bundled model registry is known to be authoritative; otherwise the requested variant is passed through unchanged for OpenCode/provider validation.
    default: ''
  oidc-base-url:
    required: false
    description: Base URL for OIDC token exchange API. Only required when running a custom GitHub App install.
    default: https://api.opencode.ai
  opencode-version:
    required: false
    description: OpenCode version to install (e.g., v1.2.3)
    default: latest
  use-bundled-toolkit:
    required: false
    description: Whether to copy the action's bundled provider configuration and review support files.
    default: 'true'
  review-only:
    required: false
    description: Install pinned pr-loop/pr-review and isolate OpenCode config for a review-only run
    default: 'false'
  pr-review-ref:
    required: false
    description: Full immutable pr-loop commit SHA supplying the pr-review skill
    default: ''
  timeout-minutes:
    required: false
    description: Maximum minutes to let 'opencode github run' execute before it is killed (uses 'timeout'/'gtimeout' when available; otherwise runs without an enforced timeout).
    default: '60'
outputs:
  opencode-version:
    description: OpenCode version resolved for this run.
    value: ${{ steps.version.outputs.opencode-version }}
  cache-hit:
    description: Whether the OpenCode binary cache was restored. Empty for review-only runs, which install a fresh OpenCode binary.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Get OpenCode version
      id: version
      shell: bash -euo pipefail {0}
      env:
        INPUT_VERSION: ${{ inputs.opencode-version }}
        GITHUB_TOKEN: ${{ github.token }}
        REVIEW_ONLY: ${{ inputs.review-only }}
      run: |
        if [[ "${INPUT_VERSION}" == "latest" ]]; then
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            auth_header=(-H "Authorization: token ${GITHUB_TOKEN}")
          else
            auth_header=()
          fi
          OPENCODE_VERSION="$(curl -fsSL "${auth_header[@]}" https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')"
        else
          OPENCODE_VERSION="${INPUT_VERSION}"
        fi
        OPENCODE_VERSION="${OPENCODE_VERSION#v}"
        if [[ "${REVIEW_ONLY}" == "true" ]]; then
          if [[ ! "${OPENCODE_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z]+([.-][0-9A-Za-z]+)*))?(\+([0-9A-Za-z]+([.-][0-9A-Za-z]+)*))?$ ]]; then
            echo "::error::Review-only requires OpenCode 1.2.14 or newer (got '${OPENCODE_VERSION}')." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}" prerelease="${BASH_REMATCH[5]:-}"
          if (( 10#${major} < 1 || (10#${major} == 1 && 10#${minor} < 2) || (10#${major} == 1 && 10#${minor} == 2 && 10#${patch} < 14) )) ||
             [[ "${major}.${minor}.${patch}" == "1.2.14" && -n "${prerelease}" ]]; then
            echo "::error::Review-only requires OpenCode 1.2.14 or newer (got '${OPENCODE_VERSION}')." >&2
            exit 1
          fi
        fi
        echo "opencode-version=${OPENCODE_VERSION}" | tee -a "${GITHUB_OUTPUT}"
    - name: Copy bundled OpenCode config
      if: inputs.use-bundled-toolkit == 'true' && inputs.review-only != 'true'
      shell: bash -euo pipefail {0}
      env:
        ACTION_PATH: ${{ github.action_path }}
        REVIEW_ONLY: ${{ inputs.review-only }}
      run: >
        "${ACTION_PATH}/scripts/prepare-opencode-config.sh"
    - name: Cache OpenCode
      id: cache
      if: inputs.review-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.opencode-version }}
    - name: Install OpenCode
      if: >
        inputs.review-only != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash -euo pipefail {0}
      env:
        OPENCODE_VERSION: ${{ steps.version.outputs.opencode-version }}
      run: >
        curl -fsSL https://opencode.ai/install | bash -s -- --version "${OPENCODE_VERSION}"
    - name: Add OpenCode to PATH
      if: inputs.review-only != 'true'
      shell: bash -euo pipefail {0}
      run: >  # zizmor: ignore[github-env] fixed path, not attacker-controlled
        echo "${HOME}/.opencode/bin" | tee -a "${GITHUB_PATH}"
    - name: Run OpenCode
      id: run_opencode
      shell: bash -euo pipefail {0}
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use-github-token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc-base-url }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        OPENCODE_VERSION: ${{ steps.version.outputs.opencode-version }}
        ACTION_PATH: ${{ github.action_path }}
        USE_BUNDLED_TOOLKIT: ${{ inputs.use-bundled-toolkit }}
        REVIEW_ONLY: ${{ inputs.review-only }}
        PR_REVIEW_REF: ${{ inputs.pr-review-ref }}
        PR_REVIEW_INSTALL_TOKEN: ${{ inputs.review-only == 'true' && github.token || '' }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        if [[ "${REVIEW_ONLY}" == "true" ]]; then
          # Scope HOME, PATH, and XDG overrides to this composite step only.
          review_home="$(mktemp -d "${RUNNER_TEMP%/}/opencode-review.XXXXXXXX")"
          trap 'rm -rf -- "${review_home}"' EXIT
          export HOME="${review_home}"
          export XDG_CONFIG_HOME="${HOME}/.config"
          export XDG_DATA_HOME="${HOME}/.local/share"
          export XDG_CACHE_HOME="${HOME}/.cache"
          export XDG_STATE_HOME="${HOME}/.local/state"
          "${ACTION_PATH}/scripts/prepare-opencode-config.sh"
          if [[ "${USE_BUNDLED_TOOLKIT}" != "true" || ! "${PR_REVIEW_REF}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Review-only requires the bundled toolkit and a full immutable pr-review commit SHA." >&2
            exit 1
          fi
          skill_dir="${HOME}/.config/opencode/skills/pr-review"
          if [[ -L "${HOME}/.config" || -L "${HOME}/.config/opencode" ||
                -L "${HOME}/.config/opencode/skills" || -e "${skill_dir}" || -L "${skill_dir}" ]]; then
            echo "::error::Unsafe or existing pr-review destination." >&2
            exit 1
          fi
          ref="$(printf '%s' "${PR_REVIEW_REF}" | tr '[:upper:]' '[:lower:]')"
          review_install_token="${PR_REVIEW_INSTALL_TOKEN:-}"
          unset PR_REVIEW_INSTALL_TOKEN
          GH_TOKEN="${review_install_token}" gh skill install dceoy/pr-loop skills/pr-review --pin "${ref}" --agent opencode --scope user
          unset review_install_token
          for file in SKILL.md references/review-lenses.md references/finding-validation.md references/github-posting.md; do
            test -f "${skill_dir}/${file}"
          done
          if find "${skill_dir}" -type l -print -quit | grep -q .; then
            echo "::error::pr-review skill contains symlinks." >&2
            exit 1
          fi
          review_install_path=""
          IFS=: read -r -a inherited_path_entries <<< "${PATH}"
          for path_entry in "${inherited_path_entries[@]}"; do
            [[ -n "${path_entry}" ]] || continue
            if [[ -x "${path_entry}/opencode" || -x "${path_entry}/opencode.exe" ]]; then
              continue
            fi
            if [[ -n "${review_install_path}" ]]; then
              review_install_path+=:
            fi
            review_install_path+="${path_entry}"
          done
          curl -fsSL https://opencode.ai/install |
            PATH="${review_install_path}" GITHUB_PATH=/dev/null bash -s -- --version "${OPENCODE_VERSION}" --no-modify-path
          if [[ ! -x "${HOME}/.opencode/bin/opencode" && ! -x "${HOME}/.opencode/bin/opencode.exe" ]]; then
            echo "::error::OpenCode installer did not install a binary in the isolated HOME." >&2
            exit 1
          fi
          export PATH="${HOME}/.opencode/bin:${PATH}"
        fi
        "${ACTION_PATH}/scripts/run-opencode.sh"
